name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Latest stable Go, not the minimum version in go.mod.
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi

      - name: goimports
        run: |
          unformatted="$(go run golang.org/x/tools/cmd/goimports@latest -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: go build
        run: go build ./...

      - name: go test -race
        run: go test -race ./...

      - name: generated files match the snapshot
        run: go run ./internal/gen -check

      - name: go generate leaves no diff
        run: |
          go generate ./...
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            exit 1
          fi

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: benchmarks still run
        run: go test -run '^$' -bench . -benchtime 1x ./...
