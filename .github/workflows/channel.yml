name: Channel

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  post:
    name: Post
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Post the release to the Telegram channel that the bot was given
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ vars.TELEGRAM_CHANNEL }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "Set the TELEGRAM_BOT_TOKEN secret, and a channel with /setchannel in the bot, to post."
            exit 0
          fi
          module="github.com/$GITHUB_REPOSITORY"
          tag="$(jq -Rr @html <<< "$TAG")"
          # What's new: the subjects of the commits since the previous version, at most ten.
          prev="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          subjects="$(git log --no-merges --format=%s "${prev:+$prev..}$TAG")"
          total="$(printf '%s' "$subjects" | grep -c . || true)"
          text="<b>TeleIQ $tag is out</b>"
          if [ "$total" -gt 0 ]; then
            news="$(printf '%s\n' "$subjects" | head -n 10 | jq -Rr '"• " + @html')"
            if [ "$total" -gt 10 ]; then
              news="$news"$'\n'"• and $((total - 10)) more"
            fi
            text="$text"$'\n\n'"<b>What's new</b>"$'\n'"$news"
          fi
          text="$text"$'\n\n'"<code>go get $module@$tag</code>"$'\n\n'"<a href=\"https://$module/releases/tag/$tag\">Release</a> · <a href=\"https://pkg.go.dev/$module@$tag\">Documentation</a>"
          curl -sS --fail-with-body -o /dev/null "https://api.telegram.org/bot$TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT" --data-urlencode "text=$text" \
            --data-urlencode "parse_mode=HTML" --data-urlencode 'link_preview_options={"is_disabled":true}'
